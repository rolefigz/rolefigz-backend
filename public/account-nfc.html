<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RoleFigz NFC — Il mio account</title>
  <link rel="icon" type="image/png" href="/assets/LogoSfondoNero.png"/>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script>
    (function() {
      const token = localStorage.getItem('rfToken');
      if (!token) { window.location.href = '/index.html'; return; }
      try {
        const p = JSON.parse(atob(token.split('.')[1]));
        if (p.exp * 1000 < Date.now()) { window.location.href = '/index.html'; }
      } catch(e) { window.location.href = '/index.html'; }
    })();
  </script>
  <style>
    /* Stesso sistema di design della landing /nfc (token, tipografia,
       componenti), cosi' il pannello cliente non sembra un'app diversa. */
    :root{
      --ink:#1D1D1F; --ink-dim:rgba(29,29,31,.62); --void:#FBFBFD; --line:rgba(0,0,0,.08);
      --accent:#0071E3; --pill:999px; --card:18px; --surface:#FFFFFF;
      --green:#1a7f4b; --red:#c0392b;
      /* alias per compatibilita' con gli stili inline generati da account-nfc.js */
      --muted:var(--ink-dim); --border:var(--line);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:var(--void);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;min-height:100vh}
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:var(--void)}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
    h3{font-size:1.02rem;font-weight:700;margin-bottom:14px}
    p{color:var(--ink-dim);line-height:1.5}

    header{border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;background:rgba(251,251,253,.8);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);position:sticky;top:0;z-index:30}
    .logo-img{height:26px;cursor:pointer}
    .nav-btn{background:rgba(0,0,0,.05);border:none;color:var(--ink);padding:9px 16px;border-radius:var(--pill);font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s ease}
    .nav-btn:hover{background:rgba(0,0,0,.08)}

    .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
    .grid{display:grid;grid-template-columns:220px 1fr;gap:28px}
    @media (max-width:780px){.grid{grid-template-columns:1fr}}
    .menu{display:flex;flex-direction:column;gap:2px}
    .menu-item{padding:11px 16px;border-radius:12px;cursor:pointer;font-size:.88rem;font-weight:500;color:var(--ink-dim);transition:background .2s ease,color .2s ease}
    .menu-item:hover{background:rgba(0,0,0,.04);color:var(--ink)}
    .menu-item.active{background:var(--ink);color:#fff;font-weight:600}

    .card{background:var(--surface);border-radius:var(--card);padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);margin-bottom:16px}

    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
    .stat{padding:18px;background:var(--surface);border-radius:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
    .stat .num{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
    .stat .lbl{font-size:.7rem;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;margin-top:4px;font-weight:600}

    .field{margin-bottom:16px}
    .field label{display:block;font-size:.76rem;font-weight:600;color:var(--ink-dim);margin-bottom:7px}
    .field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s ease}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
    .field textarea{resize:vertical;min-height:80px}
    .field input:disabled{color:var(--ink-dim);background:rgba(0,0,0,.02);cursor:not-allowed}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:560px){.form-row{grid-template-columns:1fr}}

    .btn-submit{background:var(--accent);color:#fff;border:none;padding:13px 26px;border-radius:var(--pill);font-weight:600;font-size:.88rem;cursor:pointer;transition:opacity .2s ease,transform .2s ease;font-family:inherit}
    .btn-submit:hover{opacity:.9}
    .btn-submit:active{transform:scale(.97)}
    .action-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.05);border:none;color:var(--ink);padding:8px 14px;border-radius:var(--pill);font-size:.78rem;font-weight:600;cursor:pointer;margin:0 6px 6px 0;transition:background .2s ease;font-family:inherit}
    .action-btn:hover{background:rgba(0,0,0,.08)}
    .action-btn.danger{color:var(--red)}
    .action-btn.danger:hover{background:rgba(192,57,43,.08)}
    .action-btn.active{background:var(--ink);color:#fff}
    .pg-sezione summary span{display:flex;align-items:center;gap:8px}
    .pg-sezione summary iconify-icon{color:var(--accent)}

    .msg{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:.82rem}
    .msg.err{background:rgba(192,57,43,.08);color:var(--red)}
    .msg.ok{background:rgba(26,127,75,.08);color:var(--green)}
    .loading{padding:60px;text-align:center;color:var(--ink-dim);font-size:.85rem}
    .empty-state{padding:60px 40px;text-align:center;border-radius:var(--card);background:var(--surface)}
    .empty-state .ei{font-size:36px;margin-bottom:10px;opacity:.4}
    .empty-state h3{font-size:1.1rem;color:var(--ink-dim);margin-bottom:4px}
    .pill{display:inline-block;padding:4px 12px;border-radius:var(--pill);font-size:.72rem;font-weight:600;background:rgba(0,0,0,.05);color:var(--ink-dim)}

    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th{font-size:.68rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
    td{padding:12px 8px;border-bottom:1px solid var(--line)}

    .link-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
    .link-row select,.link-row input[type=text]{font-size:.82rem;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--void);font-family:inherit}
    .link-row input[type=text]{flex:1;min-width:100px}

    .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
    .prod-card img{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:rgba(0,0,0,.03)}

    .cart-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem}
    .cart-row input[type=number]{width:56px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--void);font-family:inherit}

    .pg-sezione{border:1px solid var(--line);background:var(--surface);border-radius:var(--card);margin-bottom:14px;overflow:hidden}
    .pg-sezione summary{list-style:none;cursor:pointer;padding:16px 20px;font-size:.85rem;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .pg-sezione summary::-webkit-details-marker{display:none}
    .pg-sezione summary::after{content:"+";color:var(--accent);font-size:16px;font-weight:400}
    .pg-sezione[open] summary::after{content:"–"}
    .pg-sezione-body{padding:4px 20px 20px}

    .range-row{display:flex;align-items:center;gap:10px}
    .range-row input[type=range]{flex:1;accent-color:var(--accent)}
    .range-row .val{font-size:.8rem;color:var(--ink-dim);width:36px;text-align:right}

    .note{font-size:.78rem;color:var(--ink-dim);margin-top:6px;line-height:1.5}
  </style>
</head>
<body>

<header>
  <img class="logo-img" src="/assets/rolefigztransparente.png" alt="RoleFigz" onclick="window.location.href='/index.html'"/>
  <nav>
    <button class="nav-btn" onclick="window.location.href='/index.html'">← Torna al sito</button>
  </nav>
</header>

<div class="wrap">
  <div class="grid">
    <div class="menu">
      <div class="menu-item active" onclick="nfcTab('home', this)">Home</div>
      <div class="menu-item" onclick="nfcTab('azienda', this)">La mia azienda</div>
      <div class="menu-item" onclick="nfcTab('pagina', this)">La mia pagina</div>
      <div class="menu-item" onclick="nfcTab('qr', this)">QR</div>
      <div class="menu-item" onclick="nfcTab('merch', this)">Merchandising</div>
      <div class="menu-item" onclick="nfcTab('ordini', this)">Ordini</div>
      <div class="menu-item" onclick="nfcTab('statistiche', this)">Statistiche</div>
    </div>
    <div id="nfcContent"><div class="loading">Caricamento…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/account-nfc.js"></script>
</body>
</html>

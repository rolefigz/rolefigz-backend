<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RoleFigz — Contatti</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F4F1EA;
    --ink-dim:#B9B6AE;
    --void:#0A0A0A;
    --accent:#FF6A2C;
    --accent-dim:#C94E1A;
    --line: rgba(244,241,234,0.14);
    --card-w: 420px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--void);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- BACKGROUND SCENE ---------- */
  .scene{
    position:fixed; inset:0;
    overflow:hidden;
    z-index:0;
  }
  .scene__photo{
    position:absolute; inset:-3%;
    width:106%; height:106%;
    background-image:url('/assets/impresoras.jpeg');
    background-size:cover;
    background-position:center;
    filter: grayscale(85%) brightness(0.42) contrast(1.05);
    opacity:0;
    transform:scale(1);
    animation: kenburns 16s ease-in-out infinite alternate;
    animation-play-state:paused;
    transition: opacity 1.6s cubic-bezier(.22,.61,.36,1);
  }
  .scene__tint{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(10,10,10,0) 0%, rgba(10,10,10,.55) 60%, rgba(10,10,10,.92) 100%),
      rgba(12,12,12,0.35);
  }
  body.revealed .scene__photo{ opacity:1; animation-play-state:running; }

  @keyframes kenburns{
    from{ transform:scale(1); }
    to{ transform:scale(1.07) translate(-1%, 0%); }
  }

  /* ---------- INTRO OVERLAY ---------- */
  .intro{
    position:fixed; inset:0;
    background:var(--void);
    z-index:20;
    display:flex; align-items:center; justify-content:center;
    transition: opacity 1.4s cubic-bezier(.22,.61,.36,1);
  }
  body.revealed .intro{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- LOGO (shared element, morphs from center → header) ---------- */
  .logo-wrap{
    position:fixed;
    top:50%; left:50%;
    width:132px; height:132px;
    transform: translate(-50%,-50%) scale(0.86);
    opacity:0;
    z-index:21;
    transition:
      top 1.5s cubic-bezier(.22,.61,.36,1),
      width 1.5s cubic-bezier(.22,.61,.36,1),
      height 1.5s cubic-bezier(.22,.61,.36,1),
      transform 1.5s cubic-bezier(.22,.61,.36,1),
      opacity 1s ease;
  }
  .logo-wrap img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    filter: drop-shadow(0 0 40px rgba(255,106,44,0.08));
  }
  body.logo-in .logo-wrap{
    opacity:1;
    transform: translate(-50%,-50%) scale(1);
    animation: breathe 2.6s ease-in-out 0.2s 1;
  }
  @keyframes breathe{
    0%{ transform: translate(-50%,-50%) scale(0.94); }
    50%{ transform: translate(-50%,-50%) scale(1.03); }
    100%{ transform: translate(-50%,-50%) scale(1); }
  }
  body.revealed .logo-wrap{
    top:64px;
    width:76px; height:76px;
    transform: translate(-50%, 0) scale(1);
  }

  /* ---------- MAIN CONTENT ---------- */
  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 168px 24px 48px;
  }

  .identity{
    text-align:center;
    opacity:0;
    transform:translateY(14px);
    transition: opacity .9s ease, transform .9s cubic-bezier(.22,.61,.36,1);
  }
  body.content-in .identity{ opacity:1; transform:translateY(0); }

  .identity h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:0.01em;
    margin:0 0 6px;
  }
  .identity p{
    margin:0;
    color:var(--ink-dim);
    font-size:0.92rem;
    letter-spacing:0.02em;
  }

  /* ---------- CONTACT LINKS ---------- */
  .links{
    width:100%;
    max-width:var(--card-w);
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link{
    --d: 0ms;
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    background:rgba(244,241,234,0.045);
    border:1px solid var(--line);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity:0;
    transform:translateY(16px);
    transition:
      opacity .7s cubic-bezier(.22,.61,.36,1) var(--d),
      transform .7s cubic-bezier(.22,.61,.36,1) var(--d),
      background .25s ease, border-color .25s ease;
  }
  body.content-in .link{ opacity:1; transform:translateY(0); }

  /* corner brackets — calibration-plate detail, echoes a printer bed */
  .link::before, .link::after{
    content:''; position:absolute; width:9px; height:9px;
    border-color:var(--accent); opacity:.9;
  }
  .link::before{ top:-1px; left:-1px; border-top:1.5px solid var(--accent); border-left:1.5px solid var(--accent); }
  .link::after{ bottom:-1px; right:-1px; border-bottom:1.5px solid var(--accent); border-right:1.5px solid var(--accent); }

  .link:active{ background:rgba(244,241,234,0.09); }
  @media (hover:hover){
    .link:hover{ background:rgba(244,241,234,0.09); border-color:rgba(244,241,234,0.28); }
  }

  .link__icon{
    flex:none;
    width:22px; height:22px;
    color:var(--accent);
  }
  .link__icon svg{ width:100%; height:100%; display:block; }

  .link__text{ display:flex; flex-direction:column; line-height:1.25; }
  .link__label{ font-family:'Space Grotesk', sans-serif; font-size:0.98rem; font-weight:600; }
  .link__sub{ font-size:0.78rem; color:var(--ink-dim); margin-top:1px; }

  .link__go{
    margin-left:auto;
    color:var(--ink-dim);
    font-size:1.1rem;
    transform:translateX(0);
    transition:transform .2s ease;
  }
  .link:hover .link__go{ transform:translateX(3px); }

  .foot{
    margin-top:40px;
    font-size:0.72rem;
    letter-spacing:0.06em;
    color:rgba(185,182,174,0.55);
    opacity:0;
    transition:opacity 1s ease .3s;
  }
  body.content-in .foot{ opacity:1; }
</style>
</head>
<body>

  </main>

<script>
  // Secuencia de animación: logo sobre negro → revelado del fondo → contenido
  const body = document.body;

  // 1) el logo aparece (con respiración) a los 300ms
  setTimeout(() => body.classList.add('logo-in'), 300);

  // 2) a los ~2200ms el fondo negro se disuelve, el logo migra a su posición final
  //    y la foto con filtro gris aparece detrás
  setTimeout(() => body.classList.add('revealed'), 2200);

  // 3) cuando termina la transición del fondo (~1.6s después), entran los botones
  setTimeout(() => body.classList.add('content-in'), 2200 + 1500);
</script>
</body>
</html>

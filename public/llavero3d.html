<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuratore Llavero — RoleFigz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #f0ece4;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
}
header .logo { font-size: 18px; font-weight: 900; letter-spacing: 3px; }
header .logo span { color: #ff3c00; }
header h1 { font-size: 11px; letter-spacing: 2px; color: #555; text-transform: uppercase; }

.main { display: flex; flex: 1; overflow: hidden; }

/* ── CANVAS AREA ── */
.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  position: relative;
  overflow: hidden;
}

#canvas2d { cursor: default; display: block; }

.upload-hint {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: #444;
  pointer-events: none;
}
.upload-hint p { letter-spacing: 2px; font-size: 10px; }

.canvas-area.drag-over { outline: 2px dashed #ff3c00; outline-offset: -8px; }

/* small 3D preview */
#preview3d {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 180px;
  height: 140px;
  border: 1px solid #2a2a2a;
  background: #0a0a0a;
  cursor: grab;
  display: none;
  border-radius: 2px;
}
#preview3d.active { display: block; }
#pvLabel {
  position: absolute;
  bottom: 20px;
  right: 202px;
  font-size: 9px;
  letter-spacing: 2px;
  color: #333;
  display: none;
}
#pvLabel.active { display: block; }

/* ── CONTROLS ── */
.panel {
  width: 268px;
  flex-shrink: 0;
  border-left: 1px solid #222;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.panel-section { border-bottom: 1px solid #1a1a1a; padding: 14px 16px; }

.section-title {
  font-size: 9px;
  letter-spacing: 3px;
  color: #ff3c00;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #666;
  margin-bottom: 5px;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.field label span { color: #f0ece4; }

input[type=range] { width: 100%; accent-color: #ff3c00; cursor: pointer; }

input[type=color] {
  width: 100%; height: 30px;
  border: 1px solid #2a2a2a;
  background: none;
  cursor: pointer;
  padding: 2px;
  border-radius: 2px;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.toggle-label { color: #666; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }

.toggle {
  width: 36px; height: 20px;
  background: #222; border-radius: 10px;
  position: relative; cursor: pointer;
  border: 1px solid #333; transition: background .2s;
}
.toggle.on { background: #ff3c00; border-color: #ff3c00; }
.toggle::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff; border-radius: 50%;
  top: 2px; left: 2px; transition: left .2s;
}
.toggle.on::after { left: 18px; }

.sub-panel { display: none; padding-top: 10px; }
.sub-panel.visible { display: block; }

.upload-btn {
  width: 100%; padding: 10px;
  background: #1a1a1a; border: 1px dashed #2a2a2a;
  color: #666; cursor: pointer;
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-align: center;
  transition: border-color .2s, color .2s;
}
.upload-btn:hover { border-color: #ff3c00; color: #ff3c00; }

.btn-stl {
  margin: 16px; padding: 12px;
  background: #ff3c00; border: none; color: #fff;
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 3px;
  cursor: pointer; text-transform: uppercase;
  opacity: .35; pointer-events: none;
  transition: opacity .2s, background .15s;
}
.btn-stl.ready { opacity: 1; pointer-events: all; }
.btn-stl:hover { background: #cc3000; }

#fileInput { display: none; }

@media (max-width: 600px) {
  .main { flex-direction: column-reverse; }
  .panel { width: 100%; border-left: none; border-top: 1px solid #222; max-height: 45dvh; }
  .canvas-area { flex: 1; }
}
</style>
</head>
<body>

<header>
  <div class="logo">ROLE<span>FIGZ</span></div>
  <h1>// Configuratore Llavero</h1>
</header>

<div class="main">

  <div class="canvas-area" id="dropZone">
    <canvas id="canvas2d"></canvas>
    <div class="upload-hint" id="uploadHint">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Trascina un'immagine o clicca per caricare</p>
      <p style="color:#2a2a2a;margin-top:4px">PNG · JPG · SVG</p>
    </div>
    <span id="pvLabel">PREVIEW 3D</span>
    <canvas id="preview3d" width="180" height="140"></canvas>
  </div>

  <div class="panel">

    <div class="panel-section">
      <div class="section-title">// Immagine</div>
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        + CARICA IMMAGINE
      </button>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="panel-section">
      <div class="section-title">// Dimensioni</div>
      <div class="field">
        <label>Larghezza (mm) <span id="valW">50</span></label>
        <input type="range" id="slW" min="30" max="120" value="50" step="1">
      </div>
      <div class="field">
        <label>Spessore (mm) <span id="valT">3</span></label>
        <input type="range" id="slT" min="1" max="6" value="3" step="0.5">
      </div>
      <div class="field">
        <label>Margine (mm) <span id="valM">4</span></label>
        <input type="range" id="slM" min="0" max="12" value="4" step="0.5">
      </div>
      <div class="field">
        <label>Angoli arrotondati (mm) <span id="valR">4</span></label>
        <input type="range" id="slR" min="0" max="15" value="4" step="1">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">// Colore base</div>
      <div class="field">
        <input type="color" id="colBase" value="#ffffff">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">// Anello portachiavi</div>
      <div class="toggle-row">
        <span class="toggle-label">Attivo</span>
        <div class="toggle on" id="togRing" onclick="toggleRing()"></div>
      </div>
      <div class="sub-panel visible" id="ringPanel">
        <div class="field">
          <label>Ø esterno (mm) <span id="valRO">7</span></label>
          <input type="range" id="slRO" min="4" max="14" value="7" step="0.5">
        </div>
        <div class="field">
          <label>Ø foro (mm) <span id="valRI">4</span></label>
          <input type="range" id="slRI" min="2" max="10" value="4" step="0.5">
        </div>
        <div class="field">
          <label>Posizione X (mm) <span id="valRX">0</span></label>
          <input type="range" id="slRX" min="-20" max="20" value="0" step="1">
        </div>
      </div>
    </div>

    <button class="btn-stl" id="btnStl" onclick="esportaSTL()">
      ↓ SCARICA STL
    </button>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let userImg   = null;
let imgAspect = 1;

const p = {
  width: 50, thickness: 3, margin: 4, radius: 4,
  baseColor: '#ffffff',
  ring: true, ringOuter: 7, ringHole: 4, ringOffX: 0,
};

function pieceDims() {
  return { w: p.width, h: p.width * imgAspect };
}

// ─────────────────────────────────────────────
// 2D CANVAS
// ─────────────────────────────────────────────
const c2d = document.getElementById('canvas2d');
const ctx = c2d.getContext('2d');
const dropZone = document.getElementById('dropZone');

function draw() {
  const { w: pw, h: ph } = pieceDims();

  c2d.width  = dropZone.clientWidth;
  c2d.height = dropZone.clientHeight;

  ctx.clearRect(0, 0, c2d.width, c2d.height);
  if (!userImg) return;

  // Fit piece into canvas with padding
  const ringTop = p.ring ? p.ringOuter + 4 : 0;
  const PAD = 60;
  const sc  = Math.min(
    (c2d.width  - PAD * 2) / pw,
    (c2d.height - PAD * 2 - ringTop) / ph
  );

  const ox = (c2d.width  - pw * sc) / 2;
  const oy = (c2d.height - ph * sc) / 2 + ringTop * sc / 2;
  const r  = Math.min(p.radius * sc, pw * sc / 2, ph * sc / 2);

  // Shadow
  ctx.save();
  ctx.shadowColor  = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur   = 28;
  ctx.shadowOffsetY = 8;

  // Base plate
  rrect(ctx, ox, oy, pw * sc, ph * sc, r);
  ctx.fillStyle = p.baseColor;
  ctx.fill();
  ctx.restore();

  // Image clipped to inner rect
  if (userImg) {
    const mx = p.margin * sc;
    const ir = Math.max(0, r - mx);
    ctx.save();
    rrect(ctx, ox + mx, oy + mx, pw * sc - mx * 2, ph * sc - mx * 2, ir);
    ctx.clip();
    ctx.drawImage(userImg, ox + mx, oy + mx, pw * sc - mx * 2, ph * sc - mx * 2);
    ctx.restore();
  }

  // Plate border
  rrect(ctx, ox, oy, pw * sc, ph * sc, r);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Ring
  if (p.ring) {
    const rox = ox + pw * sc / 2 + p.ringOffX * sc;
    const roy = oy - (p.ringOuter / 2 - 1) * sc;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur  = 10;

    ctx.beginPath();
    ctx.arc(rox, roy, p.ringOuter / 2 * sc, 0, Math.PI * 2);
    ctx.fillStyle = p.baseColor;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();

    // Hole
    ctx.beginPath();
    ctx.arc(rox, roy, p.ringHole / 2 * sc, 0, Math.PI * 2);
    ctx.fillStyle = '#0d0d0d';
    ctx.fill();
  }

  // Dimension label
  ctx.fillStyle = '#3a3a3a';
  ctx.font      = '10px DM Mono, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`${p.width} × ${Math.round(ph)} mm  |  spessore ${p.thickness} mm`,
               ox, oy + ph * sc + 22);

  update3D();
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─────────────────────────────────────────────
// IMAGE UPLOAD
// ─────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    userImg   = img;
    imgAspect = img.naturalHeight / img.naturalWidth;
    URL.revokeObjectURL(url);
    document.getElementById('uploadHint').style.display = 'none';
    document.getElementById('btnStl').classList.add('ready');
    document.getElementById('preview3d').classList.add('active');
    document.getElementById('pvLabel').classList.add('active');
    rebuild3D();
    draw();
  };
  img.src = url;
}

document.getElementById('fileInput').onchange = e => loadFile(e.target.files[0]);

dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});
dropZone.addEventListener('click', e => {
  if (e.target === c2d || e.target === dropZone)
    document.getElementById('fileInput').click();
});

// ─────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────
let debounceTimer;
function schedDraw(rebuild) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { if (rebuild) rebuild3D(); draw(); }, 60);
}

function bind(id, valId, key, rebuild) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);
  sl.addEventListener('input', () => {
    p[key] = parseFloat(sl.value);
    vl.textContent = sl.value;
    schedDraw(rebuild);
  });
}

bind('slW',  'valW',  'width',     true);
bind('slT',  'valT',  'thickness', true);
bind('slM',  'valM',  'margin',    false);
bind('slR',  'valR',  'radius',    false);
bind('slRO', 'valRO', 'ringOuter', true);
bind('slRI', 'valRI', 'ringHole',  true);
bind('slRX', 'valRX', 'ringOffX',  false);

document.getElementById('colBase').addEventListener('input', e => {
  p.baseColor = e.target.value;
  if (matSide) matSide.color.set(p.baseColor);
  draw();
});

function toggleRing() {
  p.ring = !p.ring;
  document.getElementById('togRing').classList.toggle('on', p.ring);
  document.getElementById('ringPanel').classList.toggle('visible', p.ring);
  rebuild3D();
  draw();
}

const ro = new ResizeObserver(() => draw());
ro.observe(dropZone);

// ─────────────────────────────────────────────
// THREE.JS MINI PREVIEW
// ─────────────────────────────────────────────
const pv    = document.getElementById('preview3d');
const pvRen = new THREE.WebGLRenderer({ canvas: pv, antialias: true });
pvRen.setSize(180, 140);
pvRen.setClearColor(0x0a0a0a, 1);

const pvScene = new THREE.Scene();
const pvCam   = new THREE.PerspectiveCamera(38, 180 / 140, 0.1, 2000);

pvScene.add(new THREE.AmbientLight(0xffffff, 0.4));
const kl = new THREE.DirectionalLight(0xffffff, 0.9); kl.position.set(1, 2, 2); pvScene.add(kl);
const fl = new THREE.DirectionalLight(0x8899ff, 0.3); fl.position.set(-2, 0, -1); pvScene.add(fl);

let pvTheta = 0.4, pvPhi = 1.0, pvRadius = 120;
let pvTarget = new THREE.Vector3();
let pvMeshes = [];
let matSide  = null;
let imgTex   = null;

function pvUpdateCam() {
  pvCam.position.set(
    pvTarget.x + pvRadius * Math.sin(pvPhi) * Math.sin(pvTheta),
    pvTarget.y + pvRadius * Math.cos(pvPhi),
    pvTarget.z + pvRadius * Math.sin(pvPhi) * Math.cos(pvTheta)
  );
  pvCam.lookAt(pvTarget);
}

let pvDrag = false, pvPrev = { x: 0, y: 0 };
pv.addEventListener('pointerdown', e => { pvDrag = true; pvPrev = { x: e.clientX, y: e.clientY }; pv.style.cursor = 'grabbing'; });
window.addEventListener('pointerup', () => { pvDrag = false; pv.style.cursor = 'grab'; });
window.addEventListener('pointermove', e => {
  if (!pvDrag) return;
  pvTheta -= (e.clientX - pvPrev.x) * 0.018;
  pvPhi    = Math.max(0.15, Math.min(Math.PI - 0.15, pvPhi - (e.clientY - pvPrev.y) * 0.018));
  pvPrev   = { x: e.clientX, y: e.clientY };
  pvUpdateCam();
});
pv.addEventListener('wheel', e => {
  pvRadius = Math.max(30, Math.min(300, pvRadius + e.deltaY * 0.15));
  pvUpdateCam();
}, { passive: true });

function makeRRS(x, y, w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function rebuild3D() {
  if (!userImg) return;

  // Dispose old
  pvMeshes.forEach(m => { pvScene.remove(m); m.geometry.dispose(); });
  pvMeshes = [];

  const { w: pw, h: ph } = pieceDims();
  const r  = Math.min(p.radius, pw / 2, ph / 2);
  const th = p.thickness;

  // Texture from image
  const tc = document.createElement('canvas');
  tc.width  = 512;
  tc.height = Math.round(512 * imgAspect);
  const tcx = tc.getContext('2d');
  tcx.fillStyle = p.baseColor;
  tcx.fillRect(0, 0, tc.width, tc.height);
  const mx = (p.margin / pw) * tc.width;
  const my = (p.margin / ph) * tc.height;
  tcx.drawImage(userImg, mx, my, tc.width - mx * 2, tc.height - my * 2);

  if (imgTex) imgTex.dispose();
  imgTex = new THREE.CanvasTexture(tc);

  matSide = new THREE.MeshStandardMaterial({ color: p.baseColor, roughness: 0.45 });
  const matTop = new THREE.MeshStandardMaterial({ map: imgTex, roughness: 0.35 });

  // Base plate: extruded rounded rect
  const plateShape = makeRRS(0, 0, pw, ph, r);
  const plateGeo   = new THREE.ExtrudeGeometry(plateShape, { depth: th, bevelEnabled: false });

  // Assign top-face material — UVs from ExtrudeGeometry: group 0 = sides, 1 = front face, 2 = back
  const plateMesh = new THREE.Mesh(plateGeo, [matSide, matTop, matSide]);
  plateMesh.position.set(-pw / 2, -ph / 2, -th / 2);
  pvScene.add(plateMesh);
  pvMeshes.push(plateMesh);

  // Ring
  if (p.ring) {
    const rs = new THREE.Shape();
    rs.absarc(0, 0, p.ringOuter / 2, 0, Math.PI * 2, false);
    const rh = new THREE.Path();
    rh.absarc(0, 0, p.ringHole / 2, 0, Math.PI * 2, true);
    rs.holes.push(rh);
    const rg = new THREE.ExtrudeGeometry(rs, { depth: th, bevelEnabled: false });
    const rm = new THREE.Mesh(rg, matSide);
    rm.position.set(-pw / 2 + pw / 2 + p.ringOffX, ph / 2 + p.ringOuter / 2 - 1, -th / 2);
    pvScene.add(rm);
    pvMeshes.push(rm);
  }

  // Camera fit
  const maxDim = Math.max(pw, ph + (p.ring ? p.ringOuter : 0));
  pvRadius = maxDim * 2.4;
  pvTarget.set(p.ringOffX / 2, p.ring ? p.ringOuter / 4 : 0, 0);
  pvUpdateCam();
}

function update3D() {
  if (matSide) matSide.color.set(p.baseColor);
  pvRen.render(pvScene, pvCam);
}

(function loop() { requestAnimationFrame(loop); pvRen.render(pvScene, pvCam); })();

// ─────────────────────────────────────────────
// STL EXPORT
// ─────────────────────────────────────────────
function mergeGeos(geos) {
  const parts = geos.map(g => g.toNonIndexed());
  let total = 0;
  for (const g of parts) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  const nor = new Float32Array(total * 3);
  let off = 0;
  for (const g of parts) {
    pos.set(g.attributes.position.array, off * 3);
    nor.set(g.attributes.normal.array,   off * 3);
    off += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  return out;
}

function esportaSTL() {
  if (!userImg) return;
  const { w: pw, h: ph } = pieceDims();
  const r  = Math.min(p.radius, pw / 2, ph / 2);
  const th = p.thickness;

  const geos = [];

  const plateGeo = new THREE.ExtrudeGeometry(makeRRS(0, 0, pw, ph, r), { depth: th, bevelEnabled: false });
  geos.push(plateGeo);

  if (p.ring) {
    const rs = new THREE.Shape();
    rs.absarc(0, 0, p.ringOuter / 2, 0, Math.PI * 2, false);
    const rh = new THREE.Path();
    rh.absarc(0, 0, p.ringHole / 2, 0, Math.PI * 2, true);
    rs.holes.push(rh);
    const rg = new THREE.ExtrudeGeometry(rs, { depth: th, bevelEnabled: false });
    rg.translate(pw / 2 + p.ringOffX, ph + p.ringOuter / 2 - 1, 0);
    geos.push(rg);
  }

  const merged = mergeGeos(geos);
  const pos    = merged.attributes.position;
  const nTri   = pos.count / 3;
  const buf    = new ArrayBuffer(84 + nTri * 50);
  const view   = new DataView(buf);

  new TextEncoder().encodeInto('RoleFigz Llavero', new Uint8Array(buf, 0, 80));
  view.setUint32(80, nTri, true);

  let off = 84;
  for (let i = 0; i < nTri; i++) {
    const i3 = i * 3;
    const ax = pos.getX(i3),   ay = pos.getY(i3),   az = pos.getZ(i3);
    const bx = pos.getX(i3+1), by = pos.getY(i3+1), bz = pos.getZ(i3+1);
    const cx = pos.getX(i3+2), cy = pos.getY(i3+2), cz = pos.getZ(i3+2);
    const ex = bx-ax, ey = by-ay, ez = bz-az;
    const fx = cx-ax, fy = cy-ay, fz = cz-az;
    let nx = ey*fz-ez*fy, ny = ez*fx-ex*fz, nz = ex*fy-ey*fx;
    const nl = Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    nx/=nl; ny/=nl; nz/=nl;
    view.setFloat32(off,nx,true); off+=4;
    view.setFloat32(off,ny,true); off+=4;
    view.setFloat32(off,nz,true); off+=4;
    view.setFloat32(off,ax,true); off+=4; view.setFloat32(off,ay,true); off+=4; view.setFloat32(off,az,true); off+=4;
    view.setFloat32(off,bx,true); off+=4; view.setFloat32(off,by,true); off+=4; view.setFloat32(off,bz,true); off+=4;
    view.setFloat32(off,cx,true); off+=4; view.setFloat32(off,cy,true); off+=4; view.setFloat32(off,cz,true); off+=4;
    view.setUint16(off,0,true);   off+=2;
  }

  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([buf], { type: 'model/stl' })),
    download: 'llavero_rolefigz.stl',
  });
  a.click();
  URL.revokeObjectURL(a.href);
}
